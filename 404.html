<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting…</title>
    <script>
      (function () {
        // Base href provided by build; adjust if your site is deployed to a subpath
        var base = '"/ai-trainer-lvl3-exam-prep/"';
        if (base === '/') {
          base = '/';
        }
        var indexUrl = base.replace(/\/$/, '') + '/index.html';

        function fetchAndReplace(url) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                document.open();
                document.write(xhr.responseText);
                document.close();
                history.replaceState({}, '', window.location.pathname + window.location.search + window.location.hash);
              } else {
                // If fetch failed, try the site root
                var root = (base === '/') ? '/index.html' : base + 'index.html';
                if (url !== root) {
                  fetchAndReplace(root);
                }
              }
            }
          };
          xhr.send();
        }

        fetchAndReplace(indexUrl);
      })();
    </script>
  </head>
  <body>
    <noscript>
      请启用 JavaScript 以加载应用。
    </noscript>
  </body>
</html>
